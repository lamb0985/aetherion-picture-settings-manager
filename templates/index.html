<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetherion Picture Settings Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><a href="https://github.com/lamb0985/aetherion-picture-settings-manager" target="_blank" rel="noopener"><img class="brand" src="{{ url_for('static', filename='banner.svg') }}" alt="Aetherion Picture Settings Manager"></a><div class="header-device"><section class="toolbar device-toolbar"><label>Saved device<select id="device"></select></label><label>Device name<input id="deviceName" maxlength="100"></label><label>IP address<input id="deviceHost"></label><label>ADB port<input id="devicePort" type="number" min="1" max="65535"></label><button id="newDevice">New device</button><div class="device-buttons"><button id="saveDevice">Save &amp; select</button><button id="connect">Connect / refresh</button></div><div class="header-actions"><div class="status" id="connection">Not checked</div><button id="openScan" type="button">Scan</button><button id="openSource" type="button">Source</button><button id="openBulk" type="button">Bulk Apply</button></div><div class="connection-inline"><strong>Projector connection</strong><p id="context">No live status requested.</p><span id="deviceMessage" role="status"></span></div></section></div></header>
<main>








<div class="picture-layout unified-workspace"><aside class="settings-sidebar"><nav id="tabs" aria-label="Settings sections"></nav><div class="live-controls"><label class="diagnostic-toggle"><input id="rawToggle" type="checkbox"> Show native parameters and raw values</label><label class="diagnostic-toggle"><input id="liveEdit" type="checkbox"> Live synchronization</label><label class="diagnostic-toggle all-sources"><input id="allSourcesAck" type="checkbox"> Unlock live editing when All Sources is active</label><p id="liveScope" class="notice" role="status">Stored snapshots — read-only</p><p id="liveMessage" class="notice" role="status"></p></div></aside><div class="picture-content"><div class="settings-mirror-grid"><div id="menuColumn"><section class="toolbar profile-toolbar"><label>Signal format<select id="signal"></select></label><label>Picture profile<select id="profile"></select></label></section><section id="rows" aria-label="Native picture settings"></section></div><details class="group remote-panel" id="remotePanel"><summary>Remote Control · scrcpy</summary><div class="toolbar"><label>Maximum dimension<select id="remoteSize"><option>480</option><option>720</option><option>1080</option><option>1280</option><option selected>1920</option></select></label><label>Bitrate (Mbps)<select id="remoteRate"><option>2</option><option>4</option><option selected>8</option><option>12</option></select></label><label>Frame rate<select id="remoteFps"><option>15</option><option>30</option><option selected>60</option></select></label><button id="remoteStart">Start mirror</button><button id="remoteStop">Stop</button><button id="remoteFull">Fullscreen</button><button id="remoteShot">Screenshot</button></div><div class="remote-layout"><div id="remoteScreen" tabindex="0"></div><div class="remote-keys"><button data-key="DPAD_UP">▲</button><button data-key="DPAD_LEFT">◀</button><button data-key="DPAD_CENTER">OK</button><button data-key="DPAD_RIGHT">▶</button><button data-key="DPAD_DOWN">▼</button><button data-key="BACK">Back</button><button data-key="HOME">Home</button><button data-key="MENU">Menu</button><button data-key="SETTINGS">Quick Settings</button><button data-key="PICTURE_SETTINGS">Picture Settings</button><button data-key="VOLUME_DOWN">Vol −</button><button data-key="VOLUME_MUTE">Mute</button><button data-key="VOLUME_UP">Vol +</button><button data-key="HDMI_1">HDMI 1</button><button data-key="HDMI_2">HDMI 2</button><button data-key="HDMI_3">HDMI 3</button></div></div><p id="remoteMessage" role="status" class="notice">Start mirroring the selected saved device. Audio is disabled.</p></details></div></div></div>
</main>
<dialog id="scanDialog" class="utility-dialog" aria-labelledby="scanTitle"><div class="dialog-heading"><h2 id="scanTitle">Scan Picture Modes</h2><button type="button" data-close-dialog="scanDialog" aria-label="Close scan">×</button></div><section class="toolbar"><button id="scan">Scan Current Picture Modes</button><button id="cancelScan" disabled>Cancel scan</button><progress id="scanProgress" value="0" max="53"></progress><span id="scanMessage" role="status"></span></section></dialog>
<dialog id="sourceDialog" class="utility-dialog" aria-labelledby="sourceTitle"><div class="dialog-heading"><h2 id="sourceTitle">Database Source</h2><button type="button" data-close-dialog="sourceDialog" aria-label="Close source">×</button></div><section class="toolbar"><label>Database source<select id="dbSource"></select></label></section><section class="toolbar"><label>Import scanner JSON<input id="file" type="file" accept=".json,application/json"></label><button id="import">Import</button><span id="message" role="status"></span></section><section id="stats" class="stats"></section></dialog>
<dialog id="bulkDialog" class="utility-dialog" aria-labelledby="bulkTitle"><div class="dialog-heading"><h2 id="bulkTitle">Bulk Apply Picture Settings</h2><button type="button" data-close-dialog="bulkDialog" aria-label="Close bulk apply">×</button></div><section class="toolbar bulk-form"><label>Picture setting<select id="bulkKey"></select></label><label id="bulkIndexLabel" hidden>Calibration index<select id="bulkIndex"></select></label><label>Target value<select id="bulkValue"></select></label><label>Target profiles<select id="bulkScope"><option value="all">All profiles on current input</option><option value="signal">Current signal format</option><option value="selected">Selected profiles</option></select></label><div id="bulkProfiles" hidden></div><p id="bulkHint" class="notice"></p><button id="bulkPreview">Preview</button><button id="bulkApply" disabled>Bulk Apply</button><button id="bulkCancel" disabled>Cancel</button></section><progress id="bulkProgress" value="0" max="1"></progress><p id="bulkStatus" role="status"></p><div id="bulkResults"></div></dialog>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='remote.js') }}"></script>
</body></html>
