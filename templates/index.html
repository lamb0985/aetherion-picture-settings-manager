<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetherion Picture Settings Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><a href="https://github.com/lamb0985/aetherion-picture-settings-manager" target="_blank" rel="noopener"><h1>AETHERION <span>PICTURE SETTINGS MANAGER</span></h1></a><div class="status" id="connection">Not checked</div></header>
<main>
<section class="toolbar"><div><strong>Projector connection</strong><p id="context">No live status requested.</p></div><button id="connect">Connect / refresh</button></section>
<section class="toolbar"><label>Import scanner JSON<input id="file" type="file" accept=".json,application/json"></label><button id="import">Import</button><span id="message" role="status"></span></section>
<section id="stats" class="stats"></section>
<section class="toolbar"><label>Signal format<select id="signal"></select></label><label>Picture profile<select id="profile"></select></label><label>Filter settings<input id="filter" placeholder="Setting name"></label></section>
<nav id="tabs" aria-label="Setting categories"></nav>
<p class="notice">Read-only imported snapshot. Live status is separate from the snapshot. Raw option states are not interpreted as write permissions. No picture setters are enabled.</p>
<section id="rows"></section>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
